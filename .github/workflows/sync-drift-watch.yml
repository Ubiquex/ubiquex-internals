name: sync-drift-watch

# UBI-191: this site mirrors real design-doc prose and source-code
# comments -- from ubiquex and, since the Provider system section,
# ubx-provider-dynamic too -- as distilled narrative, not a copy.
# sync-state.json records, per repo, the commit each tracked file was
# last reviewed against. This workflow detects when a real source has
# moved on since: it never regenerates or edits content itself, it
# opens/updates one real, standing GitHub issue with the current report,
# same shape as ubiquex-docs's own coverage-watch.yml (UBI-187 Part 2) --
# surfacing, never a silent fix.
#
# What this is NOT: enforcement of ubiquex CLAUDE.md rule 10 ("an
# architectural change is documented here in the same body of work").
# That rule can't be checked mechanically -- telling an architectural
# change apart from a bug fix inside an already-documented mechanism
# needs judgment a diff alone doesn't encode, the same reason ubiquex's
# own "update ubiquex-docs in the same session" rule (CLAUDE.md rule 5)
# has no CI check either. This workflow is a narrower, real backstop:
# once a source file IS tracked in sync-state.json, this catches it
# moving without the doc following, whether or not rule 10 was followed
# in the same body of work. It says nothing about a genuinely new
# mechanism whose file was never registered in the first place -- that
# gap is closed only by rule 10's own discipline, not by this check.
# Daily rather than weekly specifically because rule 10 asks for
# same-work documentation -- a week-long detection lag on an
# already-tracked file undercuts that intent more than it would for a
# check with no same-work expectation behind it.

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC -- tightened from weekly (see comment above); still offset from ubiquex-docs's coverage-watch.yml (Monday 08:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  TRACKING_ISSUE_LABEL: sync-drift

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubiquex-internals
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the drift check (clones every repo named in sync-state.json itself)
        id: check
        run: |
          set +e
          python3 scripts/check_drift.py \
            --sync-state sync-state.json \
            --clone-dir "${{ runner.temp }}/sync-clones" \
            > "${{ runner.temp }}/drift-report.txt" 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "${{ runner.temp }}/drift-report.txt"
          set -e

      - name: Find the existing tracking issue, if any
        id: existing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number="$(gh issue list --label "$TRACKING_ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue (real drift found, or the check itself failed to run)
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            if [ "${{ steps.check.outputs.exit_code }}" = "2" ]; then
              echo "**check_drift.py could not run to completion** (exit 2, a setup error, not reported drift)."
            else
              echo "**Real drift found**: a mirrored source file has new commits since sync-state.json's own recorded SHA (exit 1)."
            fi
            echo
            echo "Full workflow run: $run_url"
            echo
            echo '```'
            cat "${{ runner.temp }}/drift-report.txt"
            echo '```'
          } > "${{ runner.temp }}/issue-body.md"

          if [ -n "${{ steps.existing.outputs.number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.number }}" --body-file "${{ runner.temp }}/issue-body.md"
          else
            gh issue create \
              --title "Sync drift: a mirrored source file has moved on" \
              --label "$TRACKING_ISSUE_LABEL" \
              --body-file "${{ runner.temp }}/issue-body.md"
          fi

      - name: Fail the run if drift was found (so the schedule shows red, not just the issue)
        if: steps.check.outputs.exit_code != '0'
        run: exit 1
